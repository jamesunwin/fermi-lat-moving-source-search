name: release checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install numpy scipy astropy scikit-learn
      - name: Verify release
        run: python release/fl16y_v41_incident_e2_response_v1/verify_release.py
      - name: Run focused tests
        run: python -m unittest discover -v -s tests
